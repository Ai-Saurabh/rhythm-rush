<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Rhythm Rush — Saurabh Yadav</title>
<style>
  :root {
    --bg: #0a0a14;
    --pink: #ff006e;
    --purple: #8338ec;
    --blue: #3a86ff;
    --green: #06ffa5;
    --gold: #ffbe0b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg); color: #fff;
    font-family: 'Segoe UI', -apple-system, system-ui, sans-serif;
    overflow: hidden; user-select: none;
  }
  #app { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game-wrap {
    position: relative;
    width: min(100vw, 75vh);
    height: min(133.33vw, 100vh);
    max-width: 720px; max-height: 960px;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  #hud {
    position: absolute; inset: 0; pointer-events: none; padding: 20px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-variant-numeric: tabular-nums;
  }
  #hud.hidden { display: none; }
  #hud-top { display: flex; justify-content: space-between; align-items: flex-start; }
  #score { font-size: clamp(20px, 4.5vw, 34px); font-weight: 800;
    text-shadow: 0 0 20px rgba(255,255,255,0.5); }
  #accuracy { font-size: clamp(12px, 2.5vw, 18px); font-weight: 600; color: #aaa; }

  #combo {
    position: absolute; top: 28%; left: 50%; transform: translateX(-50%);
    font-size: clamp(30px, 8vw, 56px); font-weight: 900; color: var(--gold);
    text-shadow: 0 0 30px rgba(255,190,11,0.8);
    opacity: 0; transition: opacity 0.2s; pointer-events: none; white-space: nowrap;
  }
  #combo.active { opacity: 1; }
  #combo.pop { animation: comboPop 0.15s ease-out; }
  @keyframes comboPop {
    0% { transform: translateX(-50%) scale(1.3); }
    100% { transform: translateX(-50%) scale(1); }
  }
  #progress { position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
    background: rgba(255,255,255,0.1); }
  #progress-fill { height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--pink), var(--purple), var(--blue), var(--green));
    box-shadow: 0 0 10px rgba(255,255,255,0.5); }

  .screen {
    position: absolute; inset: 0;
    background: rgba(10, 10, 20, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; padding: 40px; z-index: 10; backdrop-filter: blur(10px);
  }
  .screen.hidden { display: none; }

  #menu h1 {
    font-size: clamp(40px, 10vw, 72px); font-weight: 900; letter-spacing: 4px;
    background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue), var(--green));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(131,56,236,0.5)); text-align: center;
  }
  .subtitle { font-size: clamp(12px, 2.5vw, 16px); color: #888; letter-spacing: 3px;
    text-transform: uppercase; margin-top: -10px; }
  .difficulty { display: flex; gap: 8px; margin-top: 16px; }
  .difficulty button {
    padding: 10px 20px; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.15); color: #aaa; border-radius: 8px;
    font-size: 13px; font-weight: 700; letter-spacing: 1px; cursor: pointer;
    transition: all 0.2s; font-family: inherit;
  }
  .difficulty button:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .difficulty button.active {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; border-color: transparent;
    box-shadow: 0 0 20px rgba(131,56,236,0.5);
  }
  #play-btn {
    margin-top: 24px; padding: 18px 60px;
    font-size: clamp(16px, 3vw, 20px); font-weight: 900; letter-spacing: 3px;
    color: #fff; background: linear-gradient(135deg, var(--pink), var(--purple), var(--blue));
    border: none; border-radius: 12px; cursor: pointer; font-family: inherit;
    box-shadow: 0 0 40px rgba(131,56,236,0.6); transition: transform 0.15s, box-shadow 0.15s;
  }
  #play-btn:hover { transform: scale(1.05); box-shadow: 0 0 60px rgba(131,56,236,0.9); }
  #play-btn:active { transform: scale(0.98); }

  .keys-hint { display: flex; gap: 6px; margin-top: 16px; align-items: center; }
  .keycap {
    width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; font-weight: 800; font-size: 13px; color: #ccc;
  }

  #results h2 { font-size: clamp(18px, 3.5vw, 24px); letter-spacing: 3px;
    color: #888; font-weight: 700; }
  #grade {
    font-size: clamp(80px, 20vw, 140px); font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, var(--gold), var(--pink), var(--purple));
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 40px rgba(255,190,11,0.5));
  }
  #results-score { font-size: clamp(24px, 5vw, 36px); font-weight: 800; }
  .breakdown {
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px 30px; margin-top: 6px;
    font-size: clamp(13px, 2.5vw, 16px);
  }
  .breakdown div { display: flex; justify-content: space-between; gap: 20px; }
  .breakdown .label { color: #888; }
  .breakdown .val { font-weight: 800; }
  .breakdown .val.perfect { color: var(--green); }
  .breakdown .val.great { color: var(--blue); }
  .breakdown .val.good { color: var(--gold); }
  .breakdown .val.miss { color: var(--pink); }

  .result-buttons { display: flex; gap: 12px; margin-top: 20px; }
  .result-buttons button {
    padding: 14px 28px; font-size: 14px; font-weight: 800; letter-spacing: 2px;
    color: #fff; background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 10px;
    cursor: pointer; font-family: inherit; transition: all 0.15s;
  }
  .result-buttons button:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .result-buttons button.primary {
    background: linear-gradient(135deg, var(--pink), var(--purple));
    border-color: transparent; box-shadow: 0 0 20px rgba(131,56,236,0.5);
  }
</style>
</head>
<body>
<div id="app">
  <div id="game-wrap">
    <canvas id="game" width="720" height="960"></canvas>

    <div id="hud" class="hidden">
      <div id="hud-top">
        <div id="score">0</div>
        <div id="accuracy">100.00%</div>
      </div>
      <div id="combo"></div>
      <div id="progress"><div id="progress-fill"></div></div>
    </div>

    <div id="menu" class="screen">
      <h1>RHYTHM RUSH</h1>
      <p class="subtitle">by Saurabh Yadav</p>
      <div class="difficulty">
        <button data-diff="easy">EASY</button>
        <button data-diff="normal" class="active">NORMAL</button>
        <button data-diff="hard">HARD</button>
      </div>
      <button id="play-btn">▶ PLAY</button>
      <div class="keys-hint">
        <span class="keycap">D</span>
        <span class="keycap">F</span>
        <span class="keycap">J</span>
        <span class="keycap">K</span>
      </div>
    </div>

    <div id="results" class="screen hidden">
      <h2>RESULTS</h2>
      <div id="grade">S</div>
      <div id="results-score">0</div>
      <div class="breakdown">
        <div><span class="label">Perfect</span><span class="val perfect" id="r-perfect">0</span></div>
        <div><span class="label">Great</span><span class="val great" id="r-great">0</span></div>
        <div><span class="label">Good</span><span class="val good" id="r-good">0</span></div>
        <div><span class="label">Miss</span><span class="val miss" id="r-miss">0</span></div>
        <div><span class="label">Max Combo</span><span class="val" id="r-combo">0</span></div>
        <div><span class="label">Accuracy</span><span class="val" id="r-acc">0%</span></div>
      </div>
      <div class="result-buttons">
        <button id="retry-btn" class="primary">RETRY</button>
        <button id="menu-btn">MENU</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
